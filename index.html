<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نرگس</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #333;
            text-align: center;
        }
        .box {
            background: rgba(255, 255, 255, 0.4);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            width: 85%;
            max-width: 400px;
            margin: 20px;
        }
        .profile-pic {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { margin: 10px 0; font-size: 28px; color: #d23669; }
        p { font-size: 15px; line-height: 1.8; color: #444; font-weight: bold; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background-color: #d23669;
            color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(210, 54, 105, 0.3);
        }
        .btn:hover { background-color: #b02a56; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="box">
        <!-- این خط عکس شما را نشان می دهد -->
        <img src="profile.jpg" alt="نرگس" class="profile-pic">
        
        <h1>نرگس 🌸</h1>
        <p>
            سلام! به دنیای کوچک و رنگی من خوش آمدید.<br>
            اینجا جایی است که می‌توانید با من آشنا شوید و از حال و هوای من باخبر شوید. 
        </p>
        
        <a href="#" class="btn">ارتباط با من</a>
    </div>
</body>
    </html>
