تست<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایت شخصی من</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            text-align: center;
        }
        .box {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 80%;
            max-width: 400px;
        }
        h1 { margin-bottom: 10px; font-size: 28px; }
        p { font-size: 16px; line-height: 1.8; color: #e0e0e0; }
        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            background-color: #ffffff;
            color: #1e3c72;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover { background-color: #f0f0f0; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="box">
        <h1>سلام! من اینجا هستم 👋</h1>
        <p>این اولین وب‌سایت من است که با کمک هوش مصنوعی و گیت‌هاب ساخته‌ام.</p>
        <a href="#" class="btn">درباره من</a>
    </div>
</body>
</html>
